name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleDebug --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk Be-a-Guardian.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Be-a-Guardian-apk
          path: Be-a-Guardian.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Be a Guardian build ${{ github.run_number }}
          files: Be-a-Guardian.apk
